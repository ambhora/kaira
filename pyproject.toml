[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "kaira-spec"
version = "0.1.0"
description = "The language-independent Kaira CLI parsing specification, schema, and conformance vectors."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
docs = [
  "properdocs>=1.6",
  "mkdocs-material>=9.5",
]
test = [
  "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/ambhora/kaira"
Documentation = "https://ambhora.github.io/kaira/"

[tool.hatch.build.targets.wheel]
packages = ["src/kaira_spec"]

[tool.hatch.build.targets.wheel.force-include]
"src/SPECIFICATION.md" = "kaira_spec/data/SPECIFICATION.md"
"schema" = "kaira_spec/data/schema"
"tests/conformance" = "kaira_spec/data/conformance"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/schema",
  "/tests",
  "/README.md",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
