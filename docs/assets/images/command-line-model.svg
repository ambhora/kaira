<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 224" font-family="Inter, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Model of a Kaira command line</title>
  <desc id="d">A command line names a program, then the program's flags and options, then optionally a subcommand. Everything after the subcommand word belongs to the subcommand: its flags and options and its positional arguments, in any order. Positional arguments consist of a fixed number first, a variable number in the middle, and a fixed number last. After the delimiter -- every word is an argument.</desc>
<text x="18" y="64" font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#5b6b7f">$</text>
<rect x="40" y="44" width="56" height="30" rx="6" fill="#eef2f9" stroke="#7f9ac4"/>
<text x="68" y="64" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#243b6b">prog</text>
<rect x="110" y="44" width="73" height="30" rx="6" fill="#eef2f9" stroke="#7f9ac4"/>
<text x="146" y="64" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#243b6b">--flag</text>
<rect x="197" y="44" width="116" height="30" rx="6" fill="#eef2f9" stroke="#7f9ac4"/>
<text x="255" y="64" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#243b6b">--opt value</text>
<rect x="327" y="44" width="116" height="30" rx="6" fill="#eef2f9" stroke="#7f9ac4"/>
<text x="385" y="64" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#243b6b">--opt=value</text>
<rect x="457" y="44" width="108" height="30" rx="6" fill="#fff8e6" stroke="#c9a227"/>
<text x="511" y="64" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#6b5a1a">subcommand</text>
<rect x="579" y="44" width="73" height="30" rx="6" fill="#e2f3ea" stroke="#5fae7f"/>
<text x="616" y="64" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#1e6b3a">--flag</text>
<rect x="666" y="44" width="47" height="30" rx="6" fill="#e2f3ea" stroke="#5fae7f"/>
<text x="690" y="64" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#1e6b3a">arg</text>
<rect x="727" y="44" width="47" height="30" rx="6" fill="#e2f3ea" stroke="#5fae7f"/>
<text x="750" y="64" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#1e6b3a">arg</text>
<rect x="788" y="44" width="47" height="30" rx="6" fill="#e2f3ea" stroke="#5fae7f"/>
<text x="812" y="64" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#1e6b3a">arg</text>
<rect x="849" y="44" width="39" height="30" rx="6" fill="#f4f6f8" stroke="#8a98a8"/>
<text x="868" y="64" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#5b6b7f">--</text>
<rect x="902" y="44" width="90" height="30" rx="6" fill="#e2f3ea" stroke="#5fae7f"/>
<text x="947" y="64" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#1e6b3a">-literal</text>
<rect x="1006" y="44" width="47" height="30" rx="6" fill="#e2f3ea" stroke="#5fae7f"/>
<text x="1030" y="64" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="15" fill="#1e6b3a">arg</text>
<path d="M110 84 v8 h333 v-8" fill="none" stroke="#243b6b" stroke-width="1.5"/>
<text x="110" y="104" text-anchor="start" font-size="12" fill="#243b6b" font-weight="600">flags and options of the command</text>
<text x="511" y="18" text-anchor="middle" font-size="12" fill="#6b5a1a" font-weight="600">subcommand</text>
<text x="511" y="32" text-anchor="middle" font-size="11" fill="#6b5a1a">everything after it belongs to the subcommand</text>
<line x1="450" y1="38" x2="450" y2="90" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="4 3"/>
<path d="M579 84 v8 h474 v-8" fill="none" stroke="#1e6b3a" stroke-width="1.5"/>
<text x="579" y="104" text-anchor="start" font-size="12" fill="#1e6b3a" font-weight="600">flags, options and positional arguments of the subcommand, in any order</text>
<path d="M666 128 v8 h47 v-8" fill="none" stroke="#1e6b3a" stroke-width="1.5"/>
<text x="690" y="148" text-anchor="middle" font-size="12" fill="#1e6b3a" font-weight="normal">fixed</text>
<path d="M727 128 v8 h265 v-8" fill="none" stroke="#1e6b3a" stroke-width="1.5"/>
<text x="860" y="148" text-anchor="middle" font-size="12" fill="#1e6b3a" font-weight="normal">variable number</text>
<path d="M1006 128 v8 h47 v-8" fill="none" stroke="#1e6b3a" stroke-width="1.5"/>
<text x="1030" y="148" text-anchor="middle" font-size="12" fill="#1e6b3a" font-weight="normal">fixed</text>
<text x="666" y="168" font-size="11" fill="#1e6b3a">positional arguments: a fixed number, then a variable number, then a fixed number</text>
<text x="320" y="194" text-anchor="middle" font-size="11" fill="#5b6b7f">an option takes one value, either as the next word or after =;</text>
<text x="320" y="208" text-anchor="middle" font-size="11" fill="#5b6b7f">a flag takes none; each may have a one-letter short form</text>
<text x="908" y="194" text-anchor="middle" font-size="11" fill="#5b6b7f">after -- every word is an argument,</text>
<text x="908" y="208" text-anchor="middle" font-size="11" fill="#5b6b7f">even one that starts with a dash</text>
</svg>
