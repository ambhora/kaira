<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="Inter, Roboto, Helvetica, Arial, sans-serif" font-size="15" role="img" aria-labelledby="t d">
  <title id="t">Command levels and option scopes</title>
  <desc id="d">The command line "kaira project --name test build --release target" is split into two command levels. The first level, project, owns --name test and selects the subcommand build. The second level, build, owns --release and the positional target.</desc>

  <!-- Command line tokens -->
  <g font-family="JetBrains Mono, Menlo, monospace" font-size="15">
    <text x="20" y="40" fill="#5b6b7f">$</text>
    <!-- level 1 tokens -->
    <rect x="40" y="20" width="60" height="30" rx="6" fill="#eef2f9" stroke="#9fb3cc"/>
    <text x="70" y="40" text-anchor="middle" fill="#243b6b">kaira</text>
    <rect x="108" y="20" width="84" height="30" rx="6" fill="#dbe8f8" stroke="#7f9ac4"/>
    <text x="150" y="40" text-anchor="middle" fill="#243b6b">project</text>
    <rect x="200" y="20" width="72" height="30" rx="6" fill="#dbe8f8" stroke="#7f9ac4"/>
    <text x="236" y="40" text-anchor="middle" fill="#243b6b">--name</text>
    <rect x="280" y="20" width="54" height="30" rx="6" fill="#dbe8f8" stroke="#7f9ac4"/>
    <text x="307" y="40" text-anchor="middle" fill="#243b6b">test</text>
    <!-- level 2 tokens -->
    <rect x="352" y="20" width="62" height="30" rx="6" fill="#e2f3ea" stroke="#5fae7f"/>
    <text x="383" y="40" text-anchor="middle" fill="#1e6b3a">build</text>
    <rect x="422" y="20" width="98" height="30" rx="6" fill="#e2f3ea" stroke="#5fae7f"/>
    <text x="471" y="40" text-anchor="middle" fill="#1e6b3a">--release</text>
    <rect x="528" y="20" width="74" height="30" rx="6" fill="#e2f3ea" stroke="#5fae7f"/>
    <text x="565" y="40" text-anchor="middle" fill="#1e6b3a">target</text>
  </g>

  <!-- Scope braces -->
  <path d="M108 62 v10 h226 v-10" fill="none" stroke="#7f9ac4" stroke-width="2"/>
  <text x="221" y="92" text-anchor="middle" fill="#243b6b" font-weight="700">level 1 · project</text>
  <path d="M352 62 v10 h250 v-10" fill="none" stroke="#5fae7f" stroke-width="2"/>
  <text x="477" y="92" text-anchor="middle" fill="#1e6b3a" font-weight="700">level 2 · build</text>

  <!-- Boundary marker -->
  <line x1="343" y1="12" x2="343" y2="100" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="343" y="118" text-anchor="middle" font-size="12" fill="#c0392b">scope boundary: the subcommand word</text>

  <!-- Level cards -->
  <g>
    <rect x="40" y="140" width="380" height="140" rx="12" fill="#eef2f9" stroke="#9fb3cc"/>
    <text x="60" y="168" font-weight="700" fill="#243b6b">Level 1 — __main__.project</text>
    <text x="60" y="194" fill="#34495e">shape: <tspan font-family="JetBrains Mono, Menlo, monospace">subcommands</tspan></text>
    <text x="60" y="218" fill="#34495e">options seen: <tspan font-family="JetBrains Mono, Menlo, monospace">name = "test"</tspan></text>
    <text x="60" y="242" fill="#34495e">positionals: <tspan font-family="JetBrains Mono, Menlo, monospace">{}</tspan></text>
    <text x="60" y="266" fill="#5b6b7f" font-size="13">Parent flags and options must appear before the subcommand word.</text>
  </g>
  <g>
    <rect x="460" y="140" width="380" height="140" rx="12" fill="#e2f3ea" stroke="#8fcfa8"/>
    <text x="480" y="168" font-weight="700" fill="#1e6b3a">Level 2 — __main__.project.build</text>
    <text x="480" y="194" fill="#2c5e3f">shape: <tspan font-family="JetBrains Mono, Menlo, monospace">positionals</tspan></text>
    <text x="480" y="218" fill="#2c5e3f">flags seen: <tspan font-family="JetBrains Mono, Menlo, monospace">["release"]</tspan></text>
    <text x="480" y="242" fill="#2c5e3f">positionals: <tspan font-family="JetBrains Mono, Menlo, monospace">{"target": "target"}</tspan></text>
    <text x="480" y="266" fill="#5b6b7f" font-size="13">Options and positionals may interleave freely here.</text>
  </g>
</svg>
