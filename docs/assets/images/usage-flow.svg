<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1555 252" font-family="Inter, Roboto, Helvetica, Arial, sans-serif" font-size="14" role="img" aria-labelledby="t d">
  <title id="t">Using Kaira in a program</title>
  <desc id="d">The developer writes a KORML declaration once. At start-up the program loads it with a Kaira library for its language and passes the process argv. The library returns either a typed result (options, positionals, command path), which the application logic consumes, or an error consisting of a code and an argv index. Steps 2 to 4 behave identically in every library; the declaration is portable across languages.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b6b7f"/></marker></defs>
  <style>
    .box { fill: #ffffff; stroke: #5b6b7f; stroke-width: 1.2; }
    .you { fill: #eef4fb; stroke: #6f93c0; } .in { fill: #f4f6f8; stroke: #8a98a8; }
    .ok { fill: #e9f7ef; stroke: #5fae7f; } .err { fill: #fdeeee; stroke: #d08484; }
    .ln { fill: none; stroke: #5b6b7f; stroke-width: 1.2; marker-end: url(#a); }
    .br { fill: none; stroke: #8a98a8; stroke-width: 1; }
    .lbl { fill: #5b6b7f; font-size: 12px; } .t { fill: #1f2d3d; }
    .m { font-family: "JetBrains Mono", Menlo, monospace; font-size: 12.5px; }
  </style>
<rect class="box you" x="10" y="76" width="224" height="52" rx="6"/>
<text class="t" x="122" y="102" text-anchor="middle">1. Write the declaration</text>
<text class="t m" x="122" y="120" text-anchor="middle">greet.korml</text>
<text class="lbl" x="10" y="62" text-anchor="start">Developer, once</text>
<rect class="box lib" x="284" y="76" width="282" height="52" rx="6"/>
<text class="t" x="425" y="102" text-anchor="middle">2. Load it with a Kaira library</text>
<text class="t" x="425" y="120" text-anchor="middle">pykaira · kaira-rs · kaira-cpp</text>
<text class="lbl" x="284" y="62" text-anchor="start">Program start-up</text>
<path class="ln" d="M234 102 H284"/>
<rect class="box lib" x="616" y="76" width="232" height="34" rx="6"/>
<text class="t" x="732" y="102" text-anchor="middle">3. Parse the process argv</text>
<path class="ln" d="M566 102 H616"/>
<rect class="box in" x="702" y="154" width="60" height="34" rx="6"/>
<text class="t" x="732" y="180" text-anchor="middle">argv</text>
<path class="ln" d="M732 154 V110"/>
<text class="lbl" x="770" y="175.0" text-anchor="start">from the shell, already tokenized</text>
<rect class="box ok" x="898" y="36" width="323" height="52" rx="6"/>
<text class="t" x="1060" y="62" text-anchor="middle">4a. Typed result</text>
<text class="t" x="1060" y="80" text-anchor="middle">options · positionals · command path</text>
<rect class="box err" x="898" y="114" width="257" height="52" rx="6"/>
<text class="t" x="1026" y="140" text-anchor="middle">4b. Error: code + argv index</text>
<text class="t" x="1026" y="158" text-anchor="middle">report to the user, exit</text>
<path class="ln" d="M848 85 H873 V62 H898"/>
<path class="ln" d="M848 101 H873 V140 H898"/>
<text class="lbl" x="878" y="56.0" text-anchor="start">ok</text>
<text class="lbl" x="878" y="134.0" text-anchor="start">error</text>
<rect class="box you" x="1271" y="37.0" width="274" height="52" rx="6"/>
<text class="t" x="1408" y="63" text-anchor="middle">5. Application logic</text>
<text class="t" x="1408" y="81" text-anchor="middle">reads a native struct / record</text>
<path class="ln" d="M1221 62 H1271"/>
<path class="br" d="M284 214 V222 H1155 V214"/>
<text class="lbl" x="719" y="240" text-anchor="middle">Specified by Kaira: identical behavior and identical results in every library</text>
<path class="br" d="M10 214 V222 H234 V214"/>
<text class="lbl" x="122" y="240" text-anchor="middle">Portable across languages</text>
</svg>
